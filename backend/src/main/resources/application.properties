server.address=${AGENT_BIND_ADDRESS:127.0.0.1}
server.port=${AGENT_PORT:8080}
spring.datasource.url=${AGENT_DB_URL:jdbc:h2:file:./data/memory-agent}
spring.datasource.username=sa
spring.datasource.password=${AGENT_DB_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=200KB
spring.servlet.multipart.max-request-size=220KB
server.error.include-message=never
agent.token=${AGENT_TOKEN:}
agent.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
agent.llm.api-key=${LLM_API_KEY:}
agent.llm.model=${LLM_MODEL:}
